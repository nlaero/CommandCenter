# Windows NSIS installer for the desktop app.
# Pull requests run the build. A v* tag publishes the .exe on that GitHub release.
# No updater and no auth-server installer.

name: Windows installer

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update (for example v0.1.0-test.1)
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installer:
    name: Build NSIS installer
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build the NSIS installer
        run: npm run tauri:build -- --bundles nsis

      - name: Check the installer exists
        shell: pwsh
        run: |
          $bundle = "src-tauri\target\release\bundle"
          if (-not (Test-Path $bundle)) {
            throw "Bundle directory missing: $bundle"
          }
          Get-ChildItem -Recurse $bundle | ForEach-Object { Write-Host $_.FullName }
          $installers = @(Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" -ErrorAction SilentlyContinue)
          if ($installers.Count -lt 1) {
            throw "No NSIS setup .exe was produced"
          }
          $installers | ForEach-Object { Write-Host ("INSTALLER " + $_.Name) }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Command Center ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: src-tauri/target/release/bundle/nsis/*.exe
          body: |
            Windows installer for the Command Center desktop app.

            Sign-in is required. The default auth server is http://100.101.141.93:8080. Change that in the app if your auth-server lives somewhere else. This package is the desktop app only.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
