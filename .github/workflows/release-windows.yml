# Windows NSIS installer for Command Center.
# The build packs the pinned Tiny English model into the installer.
# Pull requests upload the installer as a build artifact. A v* tag publishes a GitHub release.
# Do not publish from a pull request. Installers stay unpublished until asked.

name: Windows installer

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update (for example v0.1.0-test.1)
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installer:
    name: Build NSIS installer
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Check the Tiny English installer script
        run: node scripts/fetch-tiny-en.test.mjs

      - name: Stage Tiny English for the installer
        run: node scripts/fetch-tiny-en.mjs

      - name: Build the NSIS installer
        run: npm run tauri:build -- --bundles nsis

      - name: Check the installer exists
        shell: pwsh
        run: |
          $bundle = "src-tauri\target\release\bundle"
          if (-not (Test-Path $bundle)) {
            throw "Bundle directory missing: $bundle"
          }
          Get-ChildItem -Recurse $bundle | ForEach-Object { Write-Host $_.FullName }
          $installers = @(Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" -ErrorAction SilentlyContinue)
          if ($installers.Count -lt 1) {
            throw "No NSIS setup .exe was produced"
          }
          $installers | ForEach-Object {
            Write-Host ("INSTALLER " + $_.Name + " " + $_.Length + " bytes")
            if ($_.Length -lt 40000000) {
              throw "Setup is $($_.Length) bytes. Tiny English was not packed (expected at least 40000000)."
            }
          }

      - name: Confirm a silent install already has Tiny English
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe") | Select-Object -First 1
          if (-not $setup) { throw "No installer to test." }
          $proc = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -PassThru
          if (-not $proc.WaitForExit(900000)) {
            try { $proc.Kill() } catch {}
            throw "The installer did not finish within 15 minutes."
          }
          if ($proc.ExitCode -ne 0) {
            throw "The installer exited $($proc.ExitCode)."
          }
          node scripts/fetch-tiny-en.mjs --expect-installed

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Command Center ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: src-tauri/target/release/bundle/nsis/*.exe
          body: |
            Windows installer for Command Center. The app opens on the board. Settings and caption fixes stay on this computer.

            Tiny English is already installed for local captions. Settings → Local AI shows that model.

            This GitHub Release is published only from a version tag. Pull requests upload the installer as a build artifact and do not publish a release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
