# Windows NSIS installer for Command Center and, when the build can see it, auth-server.
# Pull requests upload the installer as a build artifact. A v* tag publishes a GitHub release.
# Do not publish from a pull request. Installers stay unpublished until asked.

name: Windows installer

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update (for example v0.1.0-test.1)
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installer:
    name: Build NSIS installer
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Checkout auth-server
        uses: actions/checkout@v4
        with:
          repository: nlaero/command-center-auth
          ref: main
          path: auth-server-src

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            auth-server-src

      - name: Install npm dependencies
        run: npm ci

      - name: Build auth-server
        run: cargo build --release --manifest-path auth-server-src/Cargo.toml

      - name: Stage auth-server.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/resources | Out-Null
          Copy-Item auth-server-src/target/release/auth-server.exe src-tauri/resources/auth-server.exe

      - name: Build the NSIS installer
        run: npm run tauri:build -- --bundles nsis

      - name: Check the installer exists
        shell: pwsh
        run: |
          $bundle = "src-tauri\target\release\bundle"
          if (-not (Test-Path $bundle)) {
            throw "Bundle directory missing: $bundle"
          }
          Get-ChildItem -Recurse $bundle | ForEach-Object { Write-Host $_.FullName }
          $installers = @(Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" -ErrorAction SilentlyContinue)
          if ($installers.Count -lt 1) {
            throw "No NSIS setup .exe was produced"
          }
          $installers | ForEach-Object { Write-Host ("INSTALLER " + $_.Name) }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Command Center ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: src-tauri/target/release/bundle/nsis/*.exe
          body: |
            Windows installer for Command Center. It can install the desktop app, a local auth-server, or both.

            Sign-in is required. The app does not pick a server for you. Enter the auth-server URL during setup, or install a server on this computer. The server admin created during that setup is for the server and its settings, not a Command Center board login.

            The server can run as a Windows service, or start when you sign in and show an icon in the taskbar. Uninstall removes the program, the service, and the login startup entry.

            This GitHub Release is published only from a version tag. Pull requests upload the installer as a build artifact and do not publish a release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
